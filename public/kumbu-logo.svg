<svg viewBox="0 0 450 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kubika-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="kubika-orange-tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <mask id="kubika-logo-hole-mask">
      <rect width="100" height="100" fill="white" />
      <circle cx="68" cy="67" r="4.2" fill="black" />
    </mask>
  </defs>

  <!-- Símbolo KUBIKA -->
  <g transform="translate(10, 0)">
    <!-- Haste Vertical -->
    <rect x="15" y="12" width="22" height="76" rx="10" fill="url(#kubika-orange-grad)" />

    <!-- Braço Superior -->
    <path d="M 42 49 L 69 16 C 71.5 13 75.5 12 79 13.5 C 82.5 15 84.5 18.5 83.5 22 L 57 56 Z" fill="url(#kubika-orange-grad)" />

    <!-- Braço Inferior (Etiqueta com furo) -->
    <path d="M 45 46 L 59 34 L 84 62 C 86 64.5 87 67.5 87 71 C 87 77.5 81.5 83 75 83 C 71.5 83 68.5 81.5 66 79 L 45 46 Z" fill="url(#kubika-orange-tag)" mask="url(#kubika-logo-hole-mask)" />
  </g>

  <!-- Wordmark KUBIKA -->
  <text x="125" y="60" font-family="Montserrat, -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="900" fill="#0B0B0D" letter-spacing="4">KUBIK<tspan fill="#16a34a">A</tspan></text>

  <!-- Slogan Oficial: COMPARA. POUPA. ESCOLHE MELHOR. -->
  <text x="127" y="80" font-family="Montserrat, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#687280" letter-spacing="2.8">COMPARA. POUPA. ESCOLHE MELHOR.</text>
</svg>
